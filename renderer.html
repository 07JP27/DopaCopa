<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DopaCopa</title>
  <link rel="icon" href="data:,">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
      --cp-stage-ink: #080309;
      --cp-stage-black: #060207;
      --cp-stage-red: #d30c16;
      --cp-stage-red-hot: #ff3740;
      --cp-stage-red-dark: #400609;
      --cp-stage-orange: #ff6a00;
      --cp-stage-gold: #ffc422;
      --cp-stage-gold-light: #fff2a2;
      --cp-stage-gold-dark: #9e5009;
      --cp-stage-gold-edge: #3a1505;
      --cp-stage-ivory: #fffde7;
      --cp-stage-cyan: #4ff2ff;
      --cp-stage-blue: #255aff;
      --cp-stage-violet: #7725f4;
      --cp-stage-pink: #ff3bcf;
      --cp-stage-green: #79ff64;
      --cp-stage-clear: transparent;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--cp-stage-ink);
      color: var(--cp-stage-ivory);
      font: 14px/1.4 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 3px solid var(--cp-stage-cyan); outline-offset: 4px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .machine { position: relative; width: 100%; height: 100dvh; isolation: isolate; overflow: hidden; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .top {
      position: absolute; z-index: 5; left: 32px; right: 32px; top: 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: grid; gap: 8px; }
    .logo {
      display: flex; flex-direction: column; transform: skewX(-10deg);
      font-weight: 950; font-style: italic; letter-spacing: 2px; line-height: 1;
      text-shadow: 1px 2px var(--cp-stage-black), 2px 3px var(--cp-stage-gold-dark);
    }
    .logo strong {
      font-size: clamp(20px, 3.8vw, 28px);
      color: var(--cp-stage-gold-light);
      -webkit-text-stroke: .45px var(--cp-stage-gold-edge);
      paint-order: stroke fill;
      text-shadow: 0 -1px var(--cp-stage-ivory), 1px 2px var(--cp-stage-black), 2px 3px var(--cp-stage-gold-dark);
    }
    .controls { display: flex; gap: 6px; align-items: center; }
    .control {
      display: grid; place-items: center; width: 44px; height: 44px; border-radius: 0.625rem;
      border: 1px solid var(--cp-stage-gold-dark); color: var(--cp-stage-gold-light);
      background: linear-gradient(145deg, var(--cp-stage-gold-edge), var(--cp-stage-black) 52%, var(--cp-stage-gold-edge));
      box-shadow: inset 0 1px var(--cp-stage-gold-light), 0 2px 0 var(--cp-stage-black);
    }
    .control:hover { color: var(--cp-stage-ivory); border-color: var(--cp-stage-gold-light); }
    .control svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .control[data-on="true"] { color: var(--cp-stage-cyan); }
    .control[data-error="true"] { color: var(--cp-stage-red-hot); }
    .control[data-state="blocked"] { border-color: var(--cp-stage-gold-light); color: var(--cp-stage-gold); }
    #sound[data-on="true"] .sound-slash, #sound:not([data-on="true"]) .sound-wave { display: none; }
    #motion[data-on="true"] .play, #motion:not([data-on="true"]) .pause { display: none; }
    .connection {
      display: flex; gap: 6px; align-items: center;
      color: var(--cp-stage-gold); font-size: 11px; font-weight: 800; letter-spacing: 1px;
      text-shadow: 0 1px 2px var(--cp-stage-black);
    }
    .connection i { width: 5px; height: 5px; background: currentColor; transform: rotate(45deg); }
    .connection[data-state="ready"] { color: var(--cp-stage-green); }
    .connection[data-state="error"] { color: var(--cp-stage-red-hot); }
    #storage {
      position: absolute; top: 83px; right: 34px; z-index: 6; border: 0;
      background: var(--cp-stage-red-dark); color: var(--cp-stage-ivory); padding: 4px 8px;
    }
    [hidden] { display: none !important; }
    .subject {
      --caption-anchor: .62;
      position: absolute; z-index: 3; left: 36px; right: 36px; top: 62%;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      color: var(--cp-stage-ivory); transform: rotate(-2deg);
    }
    .file-name {
      position: relative; max-width: 100%; border: 0; padding: 8px 18px;
      color: var(--cp-stage-ivory);
      background: linear-gradient(90deg, var(--cp-stage-clear), var(--cp-stage-black) 15%, var(--cp-stage-black) 85%, var(--cp-stage-clear));
      font: 850 clamp(23px, 5.4vw, 48px)/1.2 Consolas, "Courier New", Courier, monospace;
      overflow-wrap: anywhere; text-wrap: balance;
      text-shadow: 1px 2px 0 var(--cp-stage-black), 0 0 12px var(--cp-stage-blue);
    }
    .file-name::before, .file-name::after {
      content: ""; position: absolute; height: 2px; left: 4%; right: 4%;
      background: linear-gradient(90deg, var(--cp-stage-clear), var(--cp-stage-gold-light), var(--cp-stage-clear));
    }
    .file-name::before { top: 0; }
    .file-name::after { bottom: 0; }
    .file-name:disabled { opacity: 1; }
    .file-path {
      font: 12px/1.4 Consolas, "Courier New", Courier, monospace;
      color: var(--cp-stage-gold-light); margin-top: 8px; overflow-wrap: anywhere;
      max-width: 100%; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-nav { display: flex; align-items: center; gap: 12px; margin-top: 8px; font: 800 14px Consolas, monospace; color: var(--cp-stage-gold); }
    .file-nav button { border: 0; background: var(--cp-stage-clear); color: var(--cp-stage-gold-light); font-size: 22px; padding: 0 8px; }
    .subject[data-flare="true"] .file-name { animation: file-hit .38s cubic-bezier(.16, 1, .3, 1) both; }
    .machine[data-phase="windup"] .subject { opacity: .45; }
    @keyframes file-hit { from { transform: translateX(45px) scale(1.1); opacity: 0; } to { transform: none; opacity: 1; } }
    .bottom {
      --counter-size: clamp(40px, 9vw, 76px);
      position: absolute; z-index: 4; bottom: 25px; left: 28px; right: 28px;
      display: flex; flex-wrap: wrap; align-items: start; justify-content: space-between; gap: 12px 16px;
      padding: 14px 16px 14px;
    }
    .metric { display: grid; gap: 8px; min-width: 0; }
    .reading { display: flex; align-items: baseline; gap: 3px; line-height: 1; }
    .combo { white-space: nowrap; }
    .combo strong, #token-count {
      font: italic 950 var(--counter-size)/1 "Segoe UI", Aptos, sans-serif;
      color: var(--cp-stage-gold);
      -webkit-text-stroke: .65px var(--cp-stage-gold-edge); paint-order: stroke fill;
      text-shadow: 0 -1px var(--cp-stage-gold-light), 1px 2px var(--cp-stage-black),
        2px 3px var(--cp-stage-gold-dark), 3px 4px var(--cp-stage-gold), 5px 6px var(--cp-stage-black);
    }
    .unit { font: 900 17px/1 "Hiragino Sans", "Segoe UI", sans-serif; color: var(--cp-stage-gold-light); }
    .signal { max-width: 100%; margin-left: auto; text-align: right; color: var(--cp-stage-gold-light); overflow-wrap: anywhere; }
    .signal .reading { justify-content: end; }
    .counter-label { display: block; color: var(--cp-stage-red-hot); font: italic 950 13px/16px "Segoe UI", sans-serif; letter-spacing: 2px; text-shadow: 0 1px 2px var(--cp-stage-black); }
    #token-count {
      display: block;
      font-variant-numeric: tabular-nums;
    }
    .fatal {
      position: absolute; z-index: 8; top: 30%; left: 32px; right: 32px; padding: 24px; background: var(--cp-stage-black);
      color: var(--cp-stage-red-hot); border: 2px solid var(--cp-stage-gold); text-align: center; font-size: 24px; font-weight: 900;
    }
    dialog {
      color: var(--cp-stage-ivory); background: var(--cp-stage-ink);
      width: min(740px, calc(100vw - 32px)); max-height: 85dvh;
      border: 2px solid var(--cp-stage-gold-dark); border-radius: 16px; padding: 20px;
    }
    dialog::backdrop { background: var(--cp-overlay); }
    .dialog-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; }
    .dialog-head h2 { margin: 0; color: var(--cp-stage-gold-light); font-size: 21px; }
    .dialog-close { border: 1px solid var(--cp-stage-gold-dark); background: var(--cp-stage-black); color: var(--cp-stage-gold-light); border-radius: 0.625rem; padding: 7px 13px; }
    .filters { display: flex; gap: 8px; margin-bottom: 12px; }
    .filters input, .filters select {
      min-width: 0; border: 1px solid var(--cp-stage-gold-dark); background: var(--cp-stage-black);
      color: var(--cp-stage-ivory); border-radius: 0.625rem; padding: 8px;
    }
    .filters input { flex: 1; }
    .filters select { width: 108px; }
    .log-row {
      width: 100%; text-align: left; border: 1px solid var(--cp-stage-gold-edge); background: var(--cp-stage-black);
      color: var(--cp-stage-ivory); border-radius: 0.625rem; padding: 10px 12px; margin: 4px 0;
    }
    .log-row strong { color: var(--cp-stage-gold); font-size: 14px; }
    .log-row p { margin: 4px 0 0; font: 12px/1.5 Consolas, monospace; overflow-wrap: anywhere; }
    .log-row time { font: 11px Consolas, monospace; color: var(--cp-stage-gold-light); float: right; }
    #type-list { display: grid; gap: 6px; margin-top: 12px; font: 11px Consolas, monospace; overflow-wrap: anywhere; }
    #type-list div { display: flex; justify-content: space-between; gap: 12px; }
    #type-list span { color: var(--cp-stage-gold); }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--cp-stage-gold-light); }
    #detail-body { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.7 Consolas, monospace; }
    @media (min-width: 900px) {
      .subject { --caption-anchor: .66; left: 8%; right: 8%; }
      .bottom { left: 5%; right: 5%; bottom: 5%; }
      .file-name { font-size: 32px; }
    }
    @media (max-width: 390px) {
      .top { left: 28px; right: 28px; top: 26px; }
      .logo strong { font-size: 20px; letter-spacing: 1px; }
      .subject { left: 28px; right: 28px; }
      .file-name { font-size: 23px; padding: 8px 4px; }
      .file-path { font-size: 11px; }
      .bottom { --counter-size: 36px; left: 24px; right: 24px; bottom: 23px; padding: 12px 10px 10px; gap: 12px; }
    }
    @media (max-height: 600px) {
      .subject { --caption-anchor: .64; }
      .file-name { font-size: 22px; padding: 5px 10px; }
      .file-path { margin-top: 4px; font-size: 10px; }
      .bottom { --counter-size: 38px; bottom: 20px; padding: 10px 12px 10px; }
    }
    .machine[data-motion="off"] *, .machine[data-motion="off"] *::before, .machine[data-motion="off"] *::after {
      animation: none !important; transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="machine" class="machine" data-phase="idle" data-motion="on">
    <canvas id="scene" aria-hidden="true"></canvas>
    <h1 class="sr-only">DopaCopa</h1>
    <p id="spoken" class="sr-only" role="status"></p>
    <header class="top">
      <div class="brand">
        <div class="logo" aria-label="DopaCopa"><strong>DopaCopa</strong></div>
        <div id="connection" class="connection" data-state="connecting" role="status"><i aria-hidden="true"></i><span id="connection-text">CONNECTING</span></div>
      </div>
      <nav class="controls" aria-label="実況の操作">
        <button id="sound" class="control" data-on="false" aria-label="音をONにする" aria-pressed="false" title="音をONにする">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-wave" d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/><path class="sound-slash" d="m16 9 5 6m0-6-5 6"/></svg>
        </button>
        <button id="motion" class="control" data-on="true" aria-label="演出を停止する" aria-pressed="true" title="演出を停止する">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause" d="M8 5v14M16 5v14"/><path class="play" d="m8 5 10 7-10 7z"/></svg>
        </button>
        <button id="history" class="control" aria-label="イベント履歴を開く" title="イベント履歴">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h14"/></svg>
        </button>
      </nav>
    </header>
    <button id="storage" hidden>保存失敗</button>
    <section id="subject" class="subject" aria-label="対象ファイル" hidden>
      <button id="file-name" class="file-name" title="完全なファイルパスを確認"></button>
      <div id="file-path" class="file-path"></div>
      <div id="file-nav" class="file-nav" hidden>
        <button id="previous-file" aria-label="前のファイル">‹</button>
        <span id="file-index"></span>
        <button id="next-file" aria-label="次のファイル">›</button>
      </div>
    </section>
    <div class="bottom">
      <div class="metric combo" aria-label="ツール実行の連撃数">
        <span class="counter-label rush">RUSH</span>
        <div class="reading"><strong id="combo-count">0</strong><span class="unit">連撃</span></div>
      </div>
      <div class="metric signal" aria-label="このセッションの入力と出力の累計トークン数">
        <span class="counter-label">TOTAL TOKENS</span>
        <div class="reading"><strong id="token-count">—</strong></div>
      </div>
    </div>
    <div id="fatal" class="fatal" role="alert" hidden></div>
  </main>
  <dialog id="history-dialog">
    <div class="dialog-head"><h2>イベント履歴</h2><button class="dialog-close" data-close="history-dialog">閉じる</button></div>
    <div class="filters">
      <input id="search" type="search" placeholder="ファイル・イベントを検索" aria-label="イベント履歴を検索">
      <select id="filter" aria-label="動作で絞り込む">
        <option value="">全種類</option><option value="read">読込</option><option value="write">書換</option>
        <option value="search">探索</option><option value="think">推論</option><option value="reply">生成</option>
        <option value="shell">実行</option><option value="compact">圧縮</option><option value="agent">参戦</option>
        <option value="permission">確認</option><option value="error">失敗</option><option value="done">完了・待機</option><option value="system">その他</option>
      </select>
    </div>
    <div id="log"></div>
    <details id="type-details"><summary>受信イベントの全種類</summary><div id="type-list"></div></details>
  </dialog>
  <dialog id="detail-dialog">
    <div class="dialog-head"><h2 id="detail-title">対象ファイル</h2><button class="dialog-close" data-close="detail-dialog">閉じる</button></div>
    <pre id="detail-body"></pre>
  </dialog>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const machine = $("machine");
    const format = (value) => Number(value).toLocaleString("ja-JP");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const basename = (path) => path.replaceAll("\\", "/").split("/").filter(Boolean).at(-1) || path;
    let snapshot = null;
    let presentation;
    let renderer;
    let tokenCounter;
    let sound;
    let source;
    let frameId = 0;
    let motion = !reducedMotion.matches;
    let reconnect = true;
    let connected = false;
    let closing = false;
    let sceneKey = "";
    let cueKey = "";
    let audioBusy = false;
    let audioIntent = null;
    let subjectKey = "";
    let subjectFiles = [];
    let selectedFile = 0;
    let fileChangedAt = 0;
    let manualFileUntil = 0;

    function report(error, label) {
      console.error(`[DopaCopa] ${label}:`, error);
      $("fatal").hidden = false;
      $("fatal").textContent = label;
      $("fatal").title = error.message.replace(/([?&])token=[^&\s]+/g, "");
    }

    function updateSound() {
      const state = sound?.state ?? "blocked";
      const on = state === "ready";
      $("sound").dataset.on = String(on);
      $("sound").dataset.state = state;
      $("sound").dataset.context = sound?.context?.state ?? "uninitialized";
      $("sound").dataset.peak = String(sound?.peak ?? 0);
      $("sound").dataset.error = state === "error" ? "true" : "false";
      $("sound").setAttribute("aria-pressed", String(on));
      const label = state === "blocked" ? "音の再生を許可する" :
        state === "error" ? "音を再試行する" : state === "paused" ? "音をOFFにする" :
        on ? "音をOFFにする" : "音をONにする";
      $("sound").setAttribute("aria-label", label);
      $("sound").title = state === "error" ? `音を再生できません: ${sound.error?.message ?? ""}` : label;
    }

    async function enableSound() {
      if (audioBusy) return;
      audioBusy = true;
      const timer = setTimeout(() => {
        audioBusy = false;
        updateSound();
      }, 1500);
      try {
        if (await sound.enable()) sound.confirm();
      } catch (error) {
        sound.error = error;
        console.error("[DopaCopa] Audio activation failed:", error);
      } finally {
        clearTimeout(timer);
        audioBusy = false;
        updateSound();
      }
    }

    function element(tag, content, className) {
      const node = document.createElement(tag);
      if (content !== undefined) node.textContent = content;
      if (className) node.className = className;
      return node;
    }

    function showDetails(title, body) {
      $("detail-title").textContent = title;
      $("detail-body").textContent = body;
      if (!$("detail-dialog").open) $("detail-dialog").showModal();
    }
    document.querySelectorAll("[data-close]").forEach((button) =>
      button.addEventListener("click", () => $(button.dataset.close).close()));

    function renderHistory() {
      if (!snapshot || !$("history-dialog").open) return;
      const needle = $("search").value.toLowerCase();
      const kind = $("filter").value;
      const fragment = document.createDocumentFragment();
      const events = snapshot.events.filter((event) => {
        const paths = [...(event.meta?.files ?? []), ...(event.meta?.targets ?? [])].map((file) => file.path).join(" ");
        return (!kind || event.kind === kind) && (!needle ||
          `${event.type} ${event.title} ${event.detail} ${paths}`.toLowerCase().includes(needle));
      }).slice(-100).reverse();
      for (const event of events) {
        const row = element("button", undefined, "log-row");
        const time = element("time", new Date(event.timestamp).toLocaleTimeString("ja-JP", { hour12: false }));
        time.dateTime = event.timestamp;
        row.append(time, element("strong", `${event.label} · ${event.title}${event.count > 1 ? ` ×${format(event.count)}` : ""}`));
        const files = event.meta?.files?.length ? event.meta.files : event.meta?.targets ?? [];
        if (files.length) row.append(element("p", files.map((file) => file.path).join("\n")));
        row.append(element("p", event.type));
        row.addEventListener("click", () => showDetails(event.title, JSON.stringify(event, null, 2)));
        fragment.append(row);
      }
      if (!events.length) fragment.append(element("p", "該当するイベントはありません。"));
      $("log").replaceChildren(fragment);
      if ($("type-details").open) {
        const types = document.createDocumentFragment();
        for (const [name, count] of Object.entries(snapshot.types).sort((a, b) => b[1] - a[1])) {
          const row = element("div");
          row.append(element("code", name), element("span", format(count)));
          types.append(row);
        }
        $("type-list").replaceChildren(types);
      }
    }
    $("history").addEventListener("click", () => { $("history-dialog").showModal(); renderHistory(); });
    $("search").addEventListener("input", renderHistory);
    $("filter").addEventListener("change", renderHistory);
    $("type-details").addEventListener("toggle", renderHistory);
    $("file-name").addEventListener("click", () => {
      if (subjectFiles.length) showDetails("対象ファイル", subjectFiles.map((file) => file.path).join("\n\n"));
    });
    $("storage").addEventListener("click", () => showDetails("保存エラー", snapshot?.storageError || "保存状態が更新されました"));

    function renderFile(index, animate = false) {
      if (!subjectFiles.length) return;
      selectedFile = (index + subjectFiles.length) % subjectFiles.length;
      const path = subjectFiles[selectedFile].path;
      $("file-name").textContent = basename(path);
      $("file-name").title = path;
      const directory = path.replaceAll("\\", "/").slice(0, -basename(path).length).replace(/\/$/, "");
      $("file-path").textContent = directory.length > 72 ? `…${directory.slice(-71)}` : directory;
      $("file-path").title = directory;
      $("file-nav").hidden = subjectFiles.length < 2;
      $("file-index").textContent = `${selectedFile + 1} / ${subjectFiles.length}`;
      $("subject").dataset.flare = "false";
      if (animate && motion && !reducedMotion.matches) {
        void $("subject").offsetWidth;
        $("subject").dataset.flare = "true";
      }
      fileChangedAt = performance.now();
    }
    $("previous-file").addEventListener("click", () => {
      manualFileUntil = performance.now() + 8000;
      renderFile(selectedFile - 1, false);
    });
    $("next-file").addEventListener("click", () => {
      manualFileUntil = performance.now() + 8000;
      renderFile(selectedFile + 1, false);
    });

    function renderSubject(scene, phase, now) {
      const signature = `${scene.id}:${scene.files.map((file) => file.path).join("|")}`;
      if (signature !== subjectKey) {
        subjectKey = signature;
        subjectFiles = scene.files;
        $("file-name").disabled = !subjectFiles.length;
        if (subjectFiles.length) {
          $("subject").hidden = false;
          renderFile(0, phase !== "sustain" && phase !== "still");
        } else if (scene.kind === "compact" && scene.before !== undefined) {
          $("subject").hidden = false;
          $("file-name").textContent = scene.after !== undefined ? `${format(scene.before)} → ${format(scene.after)}` : format(scene.before);
          $("file-path").textContent = "";
          $("file-nav").hidden = true;
        } else if (["agent", "shell"].includes(scene.kind) && scene.title) {
          $("subject").hidden = false;
          $("file-name").textContent = scene.title;
          $("file-path").textContent = "";
          $("file-nav").hidden = true;
        } else {
          $("subject").hidden = true;
          $("file-nav").hidden = true;
        }
      }
      if (subjectFiles.length > 1 && now > manualFileUntil && now - fileChangedAt > 2200) renderFile(selectedFile + 1, true);
    }

    function draw(now) {
      frameId = 0;
      if (!renderer || !presentation || document.hidden) return;
      const moving = motion && !reducedMotion.matches;
      if (machine.dataset.motion !== (moving ? "on" : "off")) updateMotion();
      const tokens = tokenCounter.valueAt(now);
      const tokenText = tokens === null ? "—" : format(tokens);
      if ($("token-count").textContent !== tokenText) $("token-count").textContent = tokenText;
      let view = presentation.step(now);
      if (!connected) {
        const failed = $("connection").dataset.state === "error";
        view = { ...view, scene: { ...view.scene, id: "disconnected", kind: failed ? "error" : "idle",
          word: failed ? "接続断" : "", theme: "red",
          files: [], major: false }, phase: "still" };
      }
      renderer.draw(view, now, moving);
      machine.dataset.phase = view.phase;
      machine.dataset.kind = view.scene.kind;
      machine.dataset.word = view.scene.word;
      machine.dataset.scene = view.scene.id;
      const key = `${view.scene.id}:${view.phase}`;
      if (key !== cueKey) {
        cueKey = key;
        if (connected && moving && ["windup", "strike", "burst"].includes(view.phase)) sound.cue(view.scene, view.phase);
      }
      if (view.scene.id !== sceneKey) {
        sceneKey = view.scene.id;
        $("spoken").textContent = `${view.scene.word} ${view.scene.files.map((file) => basename(file.path)).join("、")}`;
      }
      $("combo-count").textContent = view.combo;
      renderSubject(view.scene, view.phase, now);
      $("subject").style.opacity = String(view.opacity ?? 1);
      if (moving && connected) frameId = requestAnimationFrame(draw);
    }

    function scheduleDraw() {
      if (!frameId && !document.hidden) frameId = requestAnimationFrame(draw);
    }

    function layoutContent() {
      if (!renderer) return;
      const headerBottom = document.querySelector(".top").getBoundingClientRect().bottom;
      const footerTop = document.querySelector(".bottom").getBoundingClientRect().top;
      const subject = $("subject");
      let captionTop = footerTop;
      if (!subject.hidden) {
        const box = subject.getBoundingClientRect();
        const anchor = Number(getComputedStyle(subject).getPropertyValue("--caption-anchor"));
        const top = Math.max(headerBottom + 20,
          Math.min(machine.clientHeight * anchor, footerTop - box.height - 24));
        subject.style.top = `${Math.round(top + (box.height - subject.offsetHeight) / 2)}px`;
        captionTop = top;
      }
      renderer.playTop = headerBottom + 16;
      renderer.playBottom = Math.max(renderer.playTop + 64, captionTop - 16);
      scheduleDraw();
    }

    function resize() {
      renderer.resize(machine.clientWidth, machine.clientHeight);
      layoutContent();
      scheduleDraw();
    }

    function updateMotion() {
      const moving = motion && !reducedMotion.matches;
      machine.dataset.motion = moving ? "on" : "off";
      $("motion").dataset.on = String(moving);
      $("motion").setAttribute("aria-pressed", String(moving));
      const label = reducedMotion.matches ? "OSの設定で演出を停止中" : moving ? "演出を停止する" : "演出を再開する";
      $("motion").setAttribute("aria-label", label);
      $("motion").title = label;
      $("motion").disabled = reducedMotion.matches;
      presentation.pause(!moving || document.hidden);
      if (!moving || document.hidden) tokenCounter.set(tokenCounter.target, performance.now(), true);
      if (!moving) sound.silence();
      else if (!sound.muted && connected) sound.resume().catch((error) => {
        sound.mute();
        updateSound();
        console.error("[DopaCopa] Audio resume failed:", error);
      });
      scheduleDraw();
    }

    async function initialize() {
      const token = new URLSearchParams(location.search).get("token") || "";
      const moduleURL = new URL("/stage.mjs", location.href);
      moduleURL.searchParams.set("token", token);
      const { Presentation, SceneCanvas, SoundEngine, TokenCountUp } = await import(moduleURL.href);
      presentation = new Presentation();
      renderer = new SceneCanvas($("scene"));
      tokenCounter = new TokenCountUp();
      sound = new SoundEngine(undefined, (status) => {
        updateSound();
        scheduleDraw();
        reportAudio(status);
      });
      resize();
      new ResizeObserver(resize).observe(machine);
      const contentObserver = new ResizeObserver(layoutContent);
      contentObserver.observe($("subject"));
      contentObserver.observe(document.querySelector(".bottom"));
      updateMotion();
      updateSound();
      const rememberAudioIntent = () => {
        audioIntent = !["ready", "paused"].includes($("sound").dataset.state);
      };
      $("sound").addEventListener("pointerdown", rememberAudioIntent);
      $("sound").addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") rememberAudioIntent();
      });
      $("sound").addEventListener("click", async () => {
        const enable = audioIntent ?? !sound.audible;
        audioIntent = null;
        if (enable) await enableSound();
        else { sound.mute(); updateSound(); }
      });
      $("motion").addEventListener("click", () => { motion = !motion; updateMotion(); });
      reducedMotion.addEventListener("change", updateMotion);

      const eventsURL = new URL("/events", location.href);
      eventsURL.searchParams.set("token", token);
      source = new EventSource(eventsURL);
      source.addEventListener("open", () => {
        connected = true;
        reconnect = true;
        $("connection").dataset.state = "ready";
        $("connection-text").textContent = "Connected";
        scheduleDraw();
      });
      sound.autoEnable();
      const audioSampler = setInterval(() => {
        if (!document.hidden && sound.audible) sound.sample();
      }, 32);
      source.addEventListener("error", () => {
        connected = false;
        sound.silence();
        $("connection").dataset.state = "error";
        $("connection-text").textContent = "接続断";
        scheduleDraw();
      });
      source.addEventListener("snapshot", (message) => {
        try {
          const next = JSON.parse(message.data);
          if (!Array.isArray(next.events) || !Array.isArray(next.active) || !next.stats || !next.types) {
            throw new Error("イベントデータの形式が不正です");
          }
          snapshot = next;
          presentation.accept(snapshot, { reset: reconnect || document.hidden, now: performance.now() });
          if (reconnect) {
            sound.silence();
            if (!sound.muted && motion) sound.resume().catch((error) => {
              sound.mute();
              updateSound();
              console.error("[DopaCopa] Audio reconnect failed:", error);
            });
          }
          const { inputTokens, outputTokens } = snapshot.stats;
          const tokenTotal = Number.isFinite(inputTokens) && Number.isFinite(outputTokens) ?
            inputTokens + outputTokens : null;
          tokenCounter.set(tokenTotal, performance.now(),
            reconnect || document.hidden || !motion || reducedMotion.matches);
          reconnect = false;
          $("storage").hidden = !snapshot.storageError;
          renderHistory();
          scheduleDraw();
        } catch (error) {
          report(error, "イベント表示失敗");
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (frameId) cancelAnimationFrame(frameId);
          frameId = 0;
          presentation.pause(true);
          sound.suspend().catch((error) => {
            console.error("[DopaCopa] Audio suspend failed:", error);
            $("sound").dataset.error = "true";
            $("sound").title = "音を停止できません";
          });
        } else {
          if (snapshot) presentation.accept(snapshot, { reset: true, now: performance.now() });
          updateMotion();
        }
      });
      window.addEventListener("pagehide", () => {
        closing = true;
        source.close();
        if (frameId) cancelAnimationFrame(frameId);
        clearInterval(audioSampler);
        contentObserver.disconnect();
        sound.mute();
      }, { once: true });
    }

    function reportAudio(status) {
      if (closing || document.hidden) return;
      const token = new URLSearchParams(location.search).get("token") || "";
      fetch(`/audio-status?token=${encodeURIComponent(token)}`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(status),
      }).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
      }).catch((error) => {
        if (!closing) console.error("[DopaCopa] Audio status reporting failed:", error);
      });
    }
    initialize().catch((error) => report(error, "実況を開始できません"));
  </script>
</body>
</html>
